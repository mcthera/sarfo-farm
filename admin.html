<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Mr. Sarfo Animal Farm</title><link rel="stylesheet" href="style.css">
<style>.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td img{width:44px;height:44px;object-fit:cover;border-radius:6px}.del{color:#a22;background:none;border:0;cursor:pointer}</style></head>
<body><header><div class="wrap"><span class="logo">ADMIN DASHBOARD</span><a href="index.html">View site</a></div></header>
<div class="wrap" style="padding-top:30px">
<div class="panel"><h3>API key</h3><div class="two" style="margin-top:10px">
  <input id="key" type="password" placeholder="Enter admin API key"><button class="btn" id="login">Load dashboard</button></div></div>

<div class="panel"><h3>Add an animal</h3>
<form id="add" style="margin-top:12px"><div class="two">
  <input name="name" placeholder="Name (e.g. German Shepherd Puppy)" required>
  <select name="category"><option>Dog</option><option>Cattle</option><option>Rabbit</option><option>Pig</option><option>Turkey</option></select>
  <input name="breed" placeholder="Breed"><input name="price" type="number" step="0.01" placeholder="Price (GH₵)">
  <select name="available"><option value="1">Available</option><option value="0">Sold</option></select>
  <input name="image" type="file" accept="image/jpeg,image/png,image/webp"></div>
  <textarea name="description" rows="3" placeholder="Description"></textarea>
  <button class="btn">Upload animal</button><div id="m"></div></form></div>

<div class="panel"><h3>Animals</h3><table><tbody id="a"></tbody></table></div>
<div class="panel"><h3>Customer inquiries</h3><table><tbody id="q"></tbody></table></div>
</div>
<script>
const $=s=>document.querySelector(s),H=()=>({'X-API-Key':$('#key').value});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function go(a,opt={}){const r=await fetch('api.php?action='+a,{...opt,headers:H()});return{ok:r.ok,d:await r.json()}}
async function load(){
  const q=await go('inquiries');
  if(!q.ok){$('#m').textContent=q.d.error;return}
  $('#q').innerHTML=q.d.map(i=>`<tr><td><b>${esc(i.name)}</b><br>${esc(i.phone)}</td><td>${esc(i.message)}</td><td>${esc(i.created_at)}</td></tr>`).join('')||'<tr><td>No inquiries yet.</td></tr>';
  const a=await go('animals');
  $('#a').innerHTML=a.d.map(x=>`<tr><td>${x.image?`<img src="uploads/${esc(x.image)}" alt="">`:''}</td><td>${esc(x.name)}<br><small>${esc(x.category)}</small></td><td>${x.available?'Available':'Sold'}</td><td><button class="del" data-id="${x.id}">Delete</button></td></tr>`).join('');
}
$('#login').onclick=load;
$('#add').onsubmit=async e=>{e.preventDefault();const r=await go('add',{method:'POST',body:new FormData(e.target)});
  $('#m').textContent=r.ok?'Animal added.':r.d.error;if(r.ok){e.target.reset();load()}};
$('#a').onclick=async e=>{const id=e.target.dataset.id;if(id&&confirm('Delete this animal?')){const f=new FormData();f.append('id',id);await go('delete',{method:'POST',body:f});load()}};
</script></body></html>
